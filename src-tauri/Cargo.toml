[package]
name = "auvora"
version = "1.0.0"
description = "Offline personal audio library"
edition = "2021"
license = "MIT"
authors = ["Akniyet Manas"]
repository = "https://github.com/zsoujin/auvora"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
rfd = "0.15"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
webview2-com = "0.39.1"
windows-core = "0.62"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
