name: Prepare release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$env:RELEASE_TAG"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Set up pinned MSYS2 FFmpeg toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          # Keep these versions aligned with third_party/ffmpeg/toolchain-packages.txt.
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc=16.2.0-6
            mingw-w64-x86_64-binutils=2.47-4
            mingw-w64-x86_64-crt=14.0.0.r569.g34eeafb7d-1
            mingw-w64-x86_64-headers=14.0.0.r569.g34eeafb7d-1
            mingw-w64-x86_64-libwinpthread=14.0.0.r569.g34eeafb7d-1
            mingw-w64-x86_64-make=4.4.1-5
            mingw-w64-x86_64-nasm=3.02-1
            mingw-w64-x86_64-pkgconf=1~3.0.10-1
            diffutils=3.12-1
      - name: Prepare pinned components
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/prepare-components.ps1
      - run: node scripts/license-notices.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/collect-mpl-sources.py
      - run: npm run desktop:build
      - name: Collect installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/artifacts -Force | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe release/artifacts/
          Copy-Item src-tauri/binaries/versions.json release/artifacts/components.json
          Copy-Item docs/limitations.md release/artifacts/LIMITATIONS.md
          Get-ChildItem release/artifacts -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release-review
          path: release/artifacts/
          if-no-files-found: error
          retention-days: 14
      # Publication is a separate owner action after reviewing source obligations,
      # acceptance evidence and these exact hashes. This workflow has no write token.
